name: SimpleModDetect
version: 1.5.0
main: top.mcbi.spigot.simplemoddetect.SimpleModDetect
api-version: '26.3'
authors: [ LoliColleen, Dg32z_ ]
description: A Spigot plugin to detect mods
commands:
  simplemoddetect:
    description: SimpleModDetect 命令
    usage: /<command> [reload]
    permission: simplemoddetect.reload

permissions:
  simplemoddetect.reload:
    description: 允许重新加载 SimpleModDetect 配置
    default: op
  simplemoddetect.bypass:
    description: 绕过全部模组检测（频道检测与翻译键检测）
    default: false
  simplemoddetect.notify:
    description: 接收模组检测通知
    default: op
  simplemoddetect.check:
    description: 查看指定玩家模组列表
    default: op
  simplemoddetect.list:
    description: 查看所有已检测玩家模组
    default: op
  simplemoddetect.debug:
    description: 切换调试模式
    default: op